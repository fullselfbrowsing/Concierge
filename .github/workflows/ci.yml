name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate v0.3 source and release policy
        run: |
          node scripts/release/check.mjs source
          node scripts/release/version.mjs self-test
          node scripts/release/package.mjs self-test
          node scripts/release/compatibility.mjs self-test
          node scripts/release/seal.mjs self-test
          node scripts/release/publisher.mjs self-test

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:telemetry-payload
      - run: pnpm test

      - name: Certify exact archives with dependency, Publint, and ATTW gates
        run: |
          test ! -e "${{ runner.temp }}/release-archives"
          mkdir "${{ runner.temp }}/release-archives"
          node scripts/release/package.mjs export "${{ runner.temp }}/release-archives"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0.3-archives-${{ github.sha }}
          path: ${{ runner.temp }}/release-archives
          if-no-files-found: error

  runtime:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v0.3-archives-${{ github.sha }}
          path: archives

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install and import the sealed trio
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund --strict-peer-deps \
            ../archives/*.tgz ai@7.0.64 react@19.2.8 react-dom@19.2.8 svelte@5.56.9
          node --input-type=module <<'NODE'
          import { CONTRACT_VERSION, assertSingleInstance } from "@full-self-browsing/concierge";
          const adapter = await import("@full-self-browsing/concierge/ai-sdk");
          await import("@full-self-browsing/concierge/ai-sdk/server");
          await import("@full-self-browsing/concierge/ai-sdk/browser");
          await import("@full-self-browsing/concierge-react");
          await import("@full-self-browsing/concierge-svelte");
          assertSingleInstance();
          if (CONTRACT_VERSION !== 3 || adapter.EXPECTED_CORE_CONTRACT_VERSION !== 3) {
            throw new Error("contract v3 did not survive the packed install");
          }
          NODE

  compatibility:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v0.3-archives-${{ github.sha }}
          path: archives

      - run: node scripts/release/compatibility.mjs "$(realpath archives)"

  chromium-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @full-self-browsing/concierge-example-next-ai-sdk exec playwright install --with-deps chromium
      - run: pnpm --filter @full-self-browsing/concierge-example-next-ai-sdk exec playwright test --project=chromium
