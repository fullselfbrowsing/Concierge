name: release

# This workflow intentionally separates versioning, verification, and
# publication. Only the final job can request an npm OIDC token, and that job
# consumes immutable archives produced by the preceding no-OIDC job.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Assert pinned package tooling
        run: |
          npm install -g npm@11.11.0
          test "$(npm --version)" = "11.11.0"

      - run: pnpm install --frozen-lockfile

      # The custom version command versions a private snapshot first, restores
      # the fail-closed workspace:^ adapter peers, and regenerates/stages fresh
      # Phase 09 evidence before the action opens or updates Version Packages.
      - name: Open or update the evidence-bearing version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version:phase09
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: version
    if: ${{ needs.version.outputs.hasChangesets == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Assert pinned package tooling
        run: |
          npm install -g npm@11.11.0
          test "$(npm --version)" = "11.11.0"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm build && pnpm test
      - run: pnpm run check:artifact
      - run: pnpm run check:deps
      - run: pnpm run check:pack
      - run: pnpm run check:node-floor

      - name: Allocate the empty Phase 09 archive export
        run: |
          test ! -e "${{ runner.temp }}/phase09-archives"
          mkdir "${{ runner.temp }}/phase09-archives"

      - name: Verify and export the same-revision Phase 09 release inputs
        run: pnpm run check:phase09:release
        env:
          PHASE09_ARCHIVE_EXPORT_DIR: ${{ runner.temp }}/phase09-archives

      - name: Resolve the exact checked Phase 09 archives
        id: phase09-archives
        env:
          PHASE09_CHECKED_ARCHIVE_DIR: ${{ runner.temp }}/phase09-archives
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            appendFileSync,
            lstatSync,
            readFileSync,
            readdirSync,
            realpathSync,
          } from "node:fs";
          import { basename, join, normalize, resolve } from "node:path";

          const configured = process.env.PHASE09_CHECKED_ARCHIVE_DIR;
          const directory = realpathSync(configured);
          if (directory !== normalize(resolve(configured))) {
            throw new Error("checked archive directory is not normalized");
          }
          const manifestName = "phase-09-archive-digests.json";
          const manifestPath = join(directory, manifestName);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const packages = [
            ["core", "@fullselfbrowsing/concierge"],
            ["react", "@fullselfbrowsing/concierge-react"],
            ["svelte", "@fullselfbrowsing/concierge-svelte"],
          ];
          if (
            manifest.schemaVersion !== 1 ||
            manifest.algorithm !== "sha256" ||
            JSON.stringify(Object.keys(manifest.archives ?? {}).sort()) !==
              JSON.stringify(packages.map((entry) => entry[1]).sort())
          ) {
            throw new Error("checked archive digest manifest is malformed");
          }
          const expectedEntries = [manifestName];
          const outputs = [];
          for (const [key, packageName] of packages) {
            const record = manifest.archives[packageName];
            if (
              Object.keys(record ?? {}).sort().join(",") !== "file,sha256" ||
              typeof record.file !== "string" ||
              basename(record.file) !== record.file ||
              !record.file.endsWith(".tgz") ||
              !/^[0-9a-f]{64}$/u.test(record.sha256)
            ) {
              throw new Error(`invalid archive record: ${packageName}`);
            }
            const archivePath = join(directory, record.file);
            const metadata = lstatSync(archivePath);
            const digest = createHash("sha256")
              .update(readFileSync(archivePath))
              .digest("hex");
            if (
              !metadata.isFile() ||
              metadata.size <= 0 ||
              realpathSync(archivePath) !== archivePath ||
              digest !== record.sha256
            ) {
              throw new Error(`checked archive changed: ${record.file}`);
            }
            expectedEntries.push(record.file);
            outputs.push(`${key}=${archivePath}`);
          }
          if (
            JSON.stringify(readdirSync(directory).sort()) !==
            JSON.stringify(expectedEntries.sort())
          ) {
            throw new Error("checked archive directory is not exact");
          }
          outputs.push(`manifest=${manifestPath}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join("\n")}\n`);
          NODE

      - name: Exercise the exact-path publisher controls without publishing
        run: node scripts/phase-09-publish-archives.mjs self-test

      - name: Prepare the content-addressed publisher toolchain
        id: phase09-tools
        run: |
          test ! -e "${{ runner.temp }}/phase09-publish-tools"
          mkdir "${{ runner.temp }}/phase09-publish-tools"
          cp scripts/phase-09-publish-archives.mjs "${{ runner.temp }}/phase09-publish-tools/phase-09-publish-archives.mjs"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${{ runner.temp }}/phase09-publish-tools/npm-11.11.0.tgz" \
            https://registry.npmjs.org/npm/-/npm-11.11.0.tgz
          PHASE09_TOOL_DIR="${{ runner.temp }}/phase09-publish-tools" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            appendFileSync,
            lstatSync,
            readFileSync,
            readdirSync,
            realpathSync,
          } from "node:fs";
          import { join } from "node:path";

          const directory = realpathSync(process.env.PHASE09_TOOL_DIR);
          const publisher = join(directory, "phase-09-publish-archives.mjs");
          const npm = join(directory, "npm-11.11.0.tgz");
          if (
            JSON.stringify(readdirSync(directory).sort()) !==
              JSON.stringify(["npm-11.11.0.tgz", "phase-09-publish-archives.mjs"])
          ) {
            throw new Error("publisher tool directory is not exact");
          }
          for (const path of [publisher, npm]) {
            const metadata = lstatSync(path);
            if (!metadata.isFile() || metadata.size <= 0 || realpathSync(path) !== path) {
              throw new Error(`publisher tool is not a regular file: ${path}`);
            }
          }
          const publisherDigest = createHash("sha256")
            .update(readFileSync(publisher))
            .digest("hex");
          const npmIntegrity = `sha512-${createHash("sha512")
            .update(readFileSync(npm))
            .digest("base64")}`;
          if (publisherDigest !== "b3e6f3cee319d7a70764de3b82efcebddf3ab03a60dc721bd0ccaa1f4cdd6b71") {
            throw new Error("publisher source digest drifted");
          }
          if (npmIntegrity !== "sha512-82gRxKrh/eY5UnNorkTFcdBQAGpgjWehkfGVqAGlJjejEtJZGGJUqjo3mbBTNbc5BTnPKGVtGPBZGhElujX5cw==") {
            throw new Error("npm 11.11.0 integrity drifted");
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `publisher=${publisher}\nnpm=${npm}\n`,
          );
          NODE

      - name: Upload the exact checked Phase 09 archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase09-release-archives
          path: |
            ${{ steps.phase09-archives.outputs.core }}
            ${{ steps.phase09-archives.outputs.react }}
            ${{ steps.phase09-archives.outputs.svelte }}
            ${{ steps.phase09-archives.outputs.manifest }}
          if-no-files-found: error

      - name: Upload the exact publisher toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase09-publisher-tools
          path: |
            ${{ steps.phase09-tools.outputs.publisher }}
            ${{ steps.phase09-tools.outputs.npm }}
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download the exact checked Phase 09 archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase09-release-archives
          path: ${{ runner.temp }}/phase09-archives

      - name: Download the content-addressed publisher toolchain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase09-publisher-tools
          path: ${{ runner.temp }}/phase09-publish-tools

      - name: Verify and unpack the content-addressed npm CLI
        env:
          PHASE09_TOOL_DIR: ${{ runner.temp }}/phase09-publish-tools
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import {
            appendFileSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            readdirSync,
            realpathSync,
          } from "node:fs";
          import { join, normalize, resolve } from "node:path";

          const configured = process.env.PHASE09_TOOL_DIR;
          const [nodeMajor, nodeMinor] = process.versions.node
            .split(".")
            .slice(0, 2)
            .map(Number);
          if (nodeMajor < 22 || (nodeMajor === 22 && nodeMinor < 14)) {
            throw new Error(`publisher Node is below 22.14.0: ${process.version}`);
          }
          const directory = realpathSync(configured);
          if (directory !== normalize(resolve(configured))) {
            throw new Error("publisher tool directory is not normalized");
          }
          if (
            JSON.stringify(readdirSync(directory).sort()) !==
              JSON.stringify(["npm-11.11.0.tgz", "phase-09-publish-archives.mjs"])
          ) {
            throw new Error("downloaded publisher tool directory is not exact");
          }
          const publisher = join(directory, "phase-09-publish-archives.mjs");
          const npmArchive = join(directory, "npm-11.11.0.tgz");
          for (const path of [publisher, npmArchive]) {
            const metadata = lstatSync(path);
            if (!metadata.isFile() || metadata.size <= 0 || realpathSync(path) !== path) {
              throw new Error(`downloaded publisher tool is invalid: ${path}`);
            }
          }
          if (
            createHash("sha256").update(readFileSync(publisher)).digest("hex") !==
              "b3e6f3cee319d7a70764de3b82efcebddf3ab03a60dc721bd0ccaa1f4cdd6b71"
          ) {
            throw new Error("downloaded publisher source digest drifted");
          }
          const npmIntegrity = `sha512-${createHash("sha512")
            .update(readFileSync(npmArchive))
            .digest("base64")}`;
          if (npmIntegrity !== "sha512-82gRxKrh/eY5UnNorkTFcdBQAGpgjWehkfGVqAGlJjejEtJZGGJUqjo3mbBTNbc5BTnPKGVtGPBZGhElujX5cw==") {
            throw new Error("downloaded npm 11.11.0 integrity drifted");
          }
          const npmRoot = join(directory, "npm-cli");
          mkdirSync(npmRoot);
          const extraction = spawnSync("tar", ["-xzf", npmArchive, "-C", npmRoot], {
            encoding: "utf8",
          });
          if (extraction.error !== undefined || extraction.signal !== null || extraction.status !== 0) {
            throw new Error(`npm CLI extraction failed: ${extraction.stderr}`);
          }
          const cli = realpathSync(join(npmRoot, "package/bin/npm-cli.js"));
          if (!lstatSync(cli).isFile()) throw new Error("npm CLI is not a regular file");
          const version = spawnSync(process.execPath, [cli, "--version"], {
            encoding: "utf8",
          });
          if (
            version.error !== undefined ||
            version.signal !== null ||
            version.status !== 0 ||
            version.stdout.trim() !== "11.11.0"
          ) {
            throw new Error("content-addressed npm CLI version drifted");
          }
          appendFileSync(process.env.GITHUB_ENV, `PHASE09_NPM_CLI=${cli}\n`);
          NODE

      - name: Reverify and resolve the downloaded archive triplet
        id: downloaded-archives
        env:
          PHASE09_CHECKED_ARCHIVE_DIR: ${{ runner.temp }}/phase09-archives
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import {
            appendFileSync,
            lstatSync,
            readFileSync,
            readdirSync,
            realpathSync,
          } from "node:fs";
          import { basename, join, normalize, resolve } from "node:path";

          const configured = process.env.PHASE09_CHECKED_ARCHIVE_DIR;
          const directory = realpathSync(configured);
          if (directory !== normalize(resolve(configured))) {
            throw new Error("downloaded archive directory is not normalized");
          }
          const manifestName = "phase-09-archive-digests.json";
          const manifestPath = join(directory, manifestName);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const packages = [
            ["core", "@fullselfbrowsing/concierge"],
            ["react", "@fullselfbrowsing/concierge-react"],
            ["svelte", "@fullselfbrowsing/concierge-svelte"],
          ];
          if (
            manifest.schemaVersion !== 1 ||
            manifest.algorithm !== "sha256" ||
            JSON.stringify(Object.keys(manifest.archives ?? {}).sort()) !==
              JSON.stringify(packages.map((entry) => entry[1]).sort())
          ) {
            throw new Error("downloaded archive manifest is malformed");
          }
          const expectedEntries = [manifestName];
          const outputs = [];
          for (const [key, packageName] of packages) {
            const record = manifest.archives[packageName];
            if (
              Object.keys(record ?? {}).sort().join(",") !== "file,sha256" ||
              typeof record.file !== "string" ||
              basename(record.file) !== record.file ||
              !record.file.endsWith(".tgz") ||
              !/^[0-9a-f]{64}$/u.test(record.sha256)
            ) {
              throw new Error(`invalid downloaded archive record: ${packageName}`);
            }
            const archivePath = join(directory, record.file);
            const metadata = lstatSync(archivePath);
            const digest = createHash("sha256")
              .update(readFileSync(archivePath))
              .digest("hex");
            if (
              !metadata.isFile() ||
              metadata.size <= 0 ||
              realpathSync(archivePath) !== archivePath ||
              digest !== record.sha256
            ) {
              throw new Error(`downloaded archive changed: ${record.file}`);
            }
            expectedEntries.push(record.file);
            outputs.push(`${key}=${archivePath}`);
          }
          if (
            JSON.stringify(readdirSync(directory).sort()) !==
            JSON.stringify(expectedEntries.sort())
          ) {
            throw new Error("downloaded archive directory is not exact");
          }
          outputs.push(`manifest=${manifestPath}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `${outputs.join("\n")}\n`);
          NODE

      # No checkout, package-manager setup, install, build, or test is permitted
      # in this OIDC-capable job. The reviewed script rehashes all four inputs
      # before every exact-path publication in core -> React -> Svelte order.
      - name: Publish the exact checked archive triplet
        run: >-
          node "${{ runner.temp }}/phase09-publish-tools/phase-09-publish-archives.mjs"
          "${{ steps.downloaded-archives.outputs.manifest }}"
          "${{ steps.downloaded-archives.outputs.core }}"
          "${{ steps.downloaded-archives.outputs.react }}"
          "${{ steps.downloaded-archives.outputs.svelte }}"
