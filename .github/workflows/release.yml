name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the version-neutral release policy
        run: |
          node scripts/release/check.mjs source
          node scripts/release/version.mjs self-test
          node scripts/release/package.mjs self-test
          node scripts/release/seal.mjs self-test
          node scripts/release/publisher.mjs self-test

      - name: Open or update the fixed-trio Version Packages PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: node scripts/release/version.mjs apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: version
    if: ${{ needs.version.outputs.hasChangesets == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate, build, typecheck, and test the release source
        run: |
          npm install -g npm@11.19.0
          test "$(npm --version)" = "11.19.0"
          node scripts/release/check.mjs all
          node scripts/release/compatibility.mjs self-test
          pnpm build
          pnpm typecheck
          pnpm check:telemetry-payload
          pnpm test
          pnpm --filter @full-self-browsing/concierge-example-next-ai-sdk build

      - name: Allocate exact release inputs
        run: |
          test ! -e "${{ runner.temp }}/release-input"
          mkdir -p "${{ runner.temp }}/release-input/archives"
          mkdir "${{ runner.temp }}/release-input/npm"

      - name: Certify exact archives with dependency, Publint, and ATTW gates
        run: >-
          node scripts/release/package.mjs export
          "${{ runner.temp }}/release-input/archives"

      - name: Exercise AI SDK 6 and 7 against the exact archives
        run: >-
          node scripts/release/compatibility.mjs
          "${{ runner.temp }}/release-input/archives"

      - name: Fetch the content-addressed publisher npm CLI
        working-directory: ${{ runner.temp }}/release-input/npm
        run: |
          npm pack npm@11.19.0 --ignore-scripts
          test -f npm-11.19.0.tgz
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const integrity = `sha512-${createHash("sha512")
            .update(readFileSync("npm-11.19.0.tgz"))
            .digest("base64")}`;
          if (integrity !== "sha512-SDd/hHg3KqHE5Ht2NHWxNYNtqCQ2pXAPLl6OtQhPyED5PHsRfrOtO199MZTIG2cQoQ1ZRI9t28shrD+2cr3AAw==") {
            throw new Error("npm 11.19.0 integrity drifted");
          }
          NODE

      - name: Upload the exact untrusted release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-input
          if-no-files-found: error
          retention-days: 7

  seal:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sealedArtifact: ${{ steps.names.outputs.sealedArtifact }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve exact artifact identities
        id: names
        run: |
          echo "sealedArtifact=release-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Download the untrusted release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-input

      - name: Allocate the sealed output
        run: |
          test ! -e "${{ runner.temp }}/release-sealed"
          mkdir "${{ runner.temp }}/release-sealed"

      - name: Independently seal source policy, tools, and archive bytes
        env:
          RELEASE_INPUT_ARTIFACT: release-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          RELEASE_OUTPUT_ARTIFACT: release-sealed-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: >-
          node scripts/release/seal.mjs seal
          "${{ runner.temp }}/release-input/archives"
          "${{ runner.temp }}/release-input/npm/npm-11.19.0.tgz"
          "${{ runner.temp }}/release-sealed"

      - name: Upload the independently sealed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs.sealedArtifact }}
          path: ${{ runner.temp }}/release-sealed
          if-no-files-found: error
          retention-days: 7

  browser_e2e:
    needs: seal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the independently sealed release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.seal.outputs.sealedArtifact }}
          path: ${{ runner.temp }}/release-sealed

      - name: Install the exact trio into an isolated example
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
          test ! -e "${{ runner.temp }}/release-example"
          node scripts/release/compatibility.mjs prepare-sealed-example \
            "${{ runner.temp }}/release-sealed" \
            "${{ runner.temp }}/release-example"

      - name: Install Chromium, Firefox, and WebKit
        working-directory: ${{ runner.temp }}/release-example
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit

      - name: Exercise the signed bridge in every release browser
        working-directory: ${{ runner.temp }}/release-example
        env:
          CONCIERGE_RELEASE_BROWSERS: "1"
        run: npm run test:e2e

  publish:
    needs: [seal, browser_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the independently sealed release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.seal.outputs.sealedArtifact }}
          path: ${{ runner.temp }}/release-sealed

      - name: Verify the sealed launcher and unpack pinned npm
        env:
          RELEASE_SEALED_DIR: ${{ runner.temp }}/release-sealed
          RELEASE_OUTPUT_ARTIFACT: ${{ needs.seal.outputs.sealedArtifact }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { spawnSync } from "node:child_process";
          import {
            appendFileSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            readdirSync,
            realpathSync,
          } from "node:fs";
          import { join, normalize, resolve } from "node:path";

          const stableJson = (value) => {
            if (Array.isArray(value)) return `[${value.map(stableJson).join(",")}]`;
            if (value !== null && typeof value === "object") {
              return `{${Object.keys(value).sort().map((key) =>
                `${JSON.stringify(key)}:${stableJson(value[key])}`).join(",")}}`;
            }
            return JSON.stringify(value);
          };
          const sha256 = (value) => createHash("sha256").update(value).digest("hex");
          const integrity = (path) => `sha512-${createHash("sha512")
            .update(readFileSync(path)).digest("base64")}`;
          const directory = realpathSync(process.env.RELEASE_SEALED_DIR);
          if (directory !== normalize(resolve(process.env.RELEASE_SEALED_DIR))) {
            throw new Error("sealed release directory is not normalized");
          }
          const seal = JSON.parse(readFileSync(join(directory, "release-seal.json"), "utf8"));
          const { contentDigest, ...body } = seal;
          if (
            sha256(stableJson(body)) !== contentDigest ||
            seal.repository !== process.env.GITHUB_REPOSITORY ||
            seal.commit !== process.env.GITHUB_SHA ||
            seal.runId !== process.env.GITHUB_RUN_ID ||
            seal.runAttempt > Number(process.env.GITHUB_RUN_ATTEMPT) ||
            seal.sourceRef !== process.env.GITHUB_REF ||
            seal.outputArtifact !== process.env.RELEASE_OUTPUT_ARTIFACT ||
            seal.distTag !== "latest" || seal.contractVersion !== 2
          ) throw new Error("release seal identity or digest drifted");

          const pinned = {
            "config.mjs": "f6ecee16c34c1cf27b6f2eeee3701314c2b4324db152791111cecc6ab51299a7",
            "release-publisher.mjs": "ae010272f10e604380b8bf6f8e4cc9379112fa78a774f3360f35010826f08a9f",
            "release-line.json": "06706bfef1b06028d3066a6e4b938df9ecfbaa196ea0bafba5ae39f1a32d3da0",
          };
          const expected = ["release-seal.json"];
          for (const record of seal.tools) {
            const path = join(directory, record.file);
            if (!lstatSync(path).isFile() || realpathSync(path) !== path ||
                sha256(readFileSync(path)) !== record.sha256) {
              throw new Error(`sealed tool drifted: ${record.file}`);
            }
            if (pinned[record.file] !== undefined && pinned[record.file] !== record.sha256) {
              throw new Error(`tracked tool digest drifted: ${record.file}`);
            }
            expected.push(record.file);
          }
          for (const record of seal.archives) {
            const path = join(directory, record.file);
            if (!lstatSync(path).isFile() || realpathSync(path) !== path ||
                sha256(readFileSync(path)) !== record.sha256 || integrity(path) !== record.integrity) {
              throw new Error(`sealed archive drifted: ${record.name}`);
            }
            expected.push(record.file);
          }
          if (JSON.stringify(readdirSync(directory).sort()) !== JSON.stringify(expected.sort())) {
            throw new Error("sealed release directory is not exact");
          }
          const npmArchive = join(directory, "npm-11.19.0.tgz");
          if (integrity(npmArchive) !== "sha512-SDd/hHg3KqHE5Ht2NHWxNYNtqCQ2pXAPLl6OtQhPyED5PHsRfrOtO199MZTIG2cQoQ1ZRI9t28shrD+2cr3AAw==") {
            throw new Error("sealed npm integrity drifted");
          }
          const npmRoot = join(process.env.RUNNER_TEMP, "release-npm-cli");
          mkdirSync(npmRoot);
          const extraction = spawnSync("tar", ["-xzf", npmArchive, "-C", npmRoot], { encoding: "utf8" });
          if (extraction.error !== undefined || extraction.signal !== null || extraction.status !== 0) {
            throw new Error(`npm extraction failed: ${extraction.stderr}`);
          }
          const cli = realpathSync(join(npmRoot, "package/bin/npm-cli.js"));
          if (!lstatSync(cli).isFile()) throw new Error("npm CLI is not a regular file");
          const version = spawnSync(process.execPath, [cli, "--version"], { encoding: "utf8" });
          if (version.status !== 0 || version.stdout.trim() !== "11.19.0") {
            throw new Error("pinned npm version drifted");
          }
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_NPM_CLI=${cli}\n`);
          NODE

      - name: Publish or safely resume the exact trio through OIDC
        env:
          RELEASE_OUTPUT_ARTIFACT: ${{ needs.seal.outputs.sealedArtifact }}
        run: >-
          node "${{ runner.temp }}/release-sealed/release-publisher.mjs" publish
          "${{ runner.temp }}/release-sealed"
